<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<title>WebP Converter</title>
<style>
:root{color-scheme:dark;--bg:#0d0f13;--card:#171a20;--line:#2b3039;--text:#f6f7fb;--muted:#98a2b3;--a:#ffad1f;--a2:#ff7618;--bad:#ff8787}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#262a33 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}
main{width:min(720px,100%);padding:16px}
.card{background:#171a20ed;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 24px 80px #0006}
.drop{min-height:300px;border:2px dashed #454c58;border-radius:20px;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer;overflow:hidden;transition:.15s}
.drop.drag{border-color:var(--a);background:#ffad1f0b}
.drop img{display:none;max-width:100%;max-height:65dvh;width:auto;height:auto;object-fit:contain;border-radius:14px}
.drop.has img{display:block}.drop.has .empty{display:none}
input[type=file]{display:none}
.empty{color:var(--muted);font-weight:700}
.advanced{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:#11141a}
.advanced summary{padding:13px 15px;cursor:pointer;font-weight:800;user-select:none;color:var(--muted)}
.setting{padding:0 15px 15px}
.setting+.setting{padding-top:2px}
.setting-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:700}
.setting-head output{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--a)}
.check-setting{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.check-setting input{width:17px;height:17px;margin:0;accent-color:var(--a)}
.hint{margin-top:6px;color:#747e8e;font-size:11px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button,a{border:0;border-radius:999px;padding:13px 18px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
button{flex:1;min-width:180px;background:linear-gradient(135deg,var(--a),var(--a2));color:#171007}
button:disabled{opacity:.45;cursor:not-allowed}
.download{display:none;background:#f0f3f7;color:#111}
.status{min-height:1.3em;margin-top:10px;color:var(--muted);font-size:13px;text-align:center}
.gh{position:fixed;right:10px;bottom:8px;padding:3px 5px;color:#707887;font-size:10px;font-weight:500;opacity:.65}
.gh:hover{opacity:1;color:#aeb6c3}
</style>
</head>
<body>
<main>
<section class="card">
<label id="drop" class="drop" for="file">
<input id="file" type="file" accept="image/*">
<div class="empty">画像を選択</div>
<img id="preview" alt="">
</label>
<div class="actions">
<button id="convert" disabled>変換</button>
<a id="download" class="download">保存</a>
</div>
<details class="advanced">
<summary>詳細設定</summary>
<div class="setting">
<div class="setting-head">
<label for="quality">品質</label>
<output id="qualityValue" for="quality">100</output>
</div>
<input id="quality" type="range" min="0" max="100" step="1" value="100">
<div class="hint">100で元画像に最も近く、下げるほど圧縮を強くします。</div>
</div>
<div class="setting">
<label class="check-setting" for="resize450">
<input id="resize450" type="checkbox">
<span>450×450以内に自動縮小</span>
</label>
<div class="hint">縦横比を維持し、450pxを超える画像だけ縮小します。</div>
</div>
</details>
<div id="status" class="status"></div>
</section>
</main>
<a class="gh" href="https://github.com/22552" target="_blank" rel="noopener noreferrer">22552</a>
<script type="module">
const $=s=>document.querySelector(s);
const file=$('#file'),drop=$('#drop'),preview=$('#preview'),convert=$('#convert'),download=$('#download'),status=$('#status'),quality=$('#quality'),qualityValue=$('#qualityValue'),resize450=$('#resize450');
let sourceFile=null,sourceImage=null,inputURL=null,outputURL=null,encoderPromise=null;

['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files?.[0];if(f)load(f)});
file.addEventListener('change',()=>{const f=file.files?.[0];if(f)load(f)});
quality.addEventListener('input',()=>{qualityValue.value=quality.value});

function msg(s,bad=false){status.textContent=s;status.style.color=bad?'var(--bad)':''}
function load(f){
  if(!f.type.startsWith('image/'))return msg('画像を選んでください',true);
  sourceFile=f;sourceImage=null;convert.disabled=true;download.style.display='none';msg('');
  if(outputURL){URL.revokeObjectURL(outputURL);outputURL=null}
  if(inputURL)URL.revokeObjectURL(inputURL);
  inputURL=URL.createObjectURL(f);
  preview.src=inputURL;
  const img=new Image();
  img.onload=()=>{
    if(img.naturalHeight<2)return msg('この画像は変換できません',true);
    sourceImage=img;
    drop.classList.add('has');convert.disabled=false;msg('');
  };
  img.onerror=()=>{sourceImage=null;drop.classList.remove('has');msg('画像を読み込めません',true)};
  img.src=inputURL;
}

async function getEncoder(){
  if(!encoderPromise){
    encoderPromise=import('https://esm.sh/@jsquash/webp@1.5.0').then(m=>{
      const encode=m.encode ?? m.default?.encode ?? (typeof m.default==='function'?m.default:null);
      if(typeof encode!=='function')throw new Error('WebP encoder export not found');
      return encode;
    }).catch(e=>{
      encoderPromise=null;
      console.error(e);
      throw new Error('変換処理を読み込めません');
    });
  }
  return encoderPromise;
}

function ascii(s){return new TextEncoder().encode(s)}
function u24(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255])}
function u32(n){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n>>>0,true);return a}
function cat(...xs){const n=xs.reduce((a,b)=>a+b.length,0),o=new Uint8Array(n);let p=0;for(const x of xs){o.set(x,p);p+=x.length}return o}
function chunk(tag,payload){return cat(ascii(tag),u32(payload.length),payload,(payload.length&1)?new Uint8Array([0]):new Uint8Array())}
function tagAt(a,o){return String.fromCharCode(a[o],a[o+1],a[o+2],a[o+3])}
function fromHex(s){return new Uint8Array(s.match(/../g).map(x=>parseInt(x,16)))}
const tinyTransparentVP8L=fromHex('5650384c130000002f004000100f30ace33f19f31ff0988088fe8700');

function extractVP8L(buffer){
  const a=new Uint8Array(buffer);
  if(tagAt(a,0)!=='RIFF'||tagAt(a,8)!=='WEBP')throw new Error('変換失敗');
  let o=12;
  while(o+8<=a.length){
    const tag=tagAt(a,o),size=new DataView(a.buffer,a.byteOffset+o+4,4).getUint32(0,true),end=o+8+size;
    if(end>a.length)break;
    if(tag==='VP8L')return a.slice(o,end+(size&1));
    o=end+(size&1);
  }
  throw new Error('変換失敗');
}

function buildTargetWebP(firstVP8L,w,h){
  if(w<1||h<2||w>16777216||h>16777216)throw new Error('この画像は変換できません');
  const vp8x=cat(new Uint8Array([0x12,0,0,0]),u24(w-1),u24(h-1));
  const anim=new Uint8Array([0xff,0xff,0xff,0xff,0x00,0x00]);
  const firstHeader=cat(u24(0),u24(0),u24(w-1),u24(h-1),u24(100),new Uint8Array([0x02]));
  const first=chunk('ANMF',cat(firstHeader,firstVP8L));
  const xPx=(w-1)&~1,yPx=(h-2)&~1;
  const secondHeader=cat(u24(xPx>>>1),u24(yPx>>>1),u24(0),u24(1),u24(100),new Uint8Array([0x00]));
  const second=chunk('ANMF',cat(secondHeader,tinyTransparentVP8L));
  const body=cat(chunk('VP8X',vp8x),chunk('ANIM',anim),first,second);
  const payload=cat(ascii('WEBP'),body);
  return new Blob([ascii('RIFF'),u32(payload.length),payload],{type:'image/webp'});
}

convert.addEventListener('click',async()=>{
  if(!sourceImage||!sourceImage.complete||!sourceImage.naturalWidth)return;
  convert.disabled=true;download.style.display='none';msg('変換中…');
  try{
    const encodeWebP=await getEncoder();
    let w=sourceImage.naturalWidth,h=sourceImage.naturalHeight;
    if(resize450.checked&&(w>450||h>450)){
      const scale=Math.min(450/w,450/h);
      w=Math.max(1,Math.round(w*scale));
      h=Math.max(2,Math.round(h*scale));
    }
    const q=Math.max(0,Math.min(100,Number(quality.value)||0));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d',{alpha:true,willReadFrequently:true});
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.clearRect(0,0,w,h);ctx.drawImage(sourceImage,0,0,w,h);
    const imageData=ctx.getImageData(0,0,w,h);
    const staticBuffer=await encodeWebP(imageData,{lossless:1,quality:q,method:6,exact:1,near_lossless:q,alpha_quality:100});
    const blob=buildTargetWebP(extractVP8L(staticBuffer),w,h);
    if(outputURL)URL.revokeObjectURL(outputURL);outputURL=URL.createObjectURL(blob);
    const base=(sourceFile?.name||'image').replace(/\.[^.]+$/,'');
    download.href=outputURL;download.download=`${base}.webp`;download.style.display='inline-block';
    preview.src=outputURL;
    drop.classList.add('has');
    msg('');
  }catch(e){console.error(e);msg(e?.message||'変換失敗',true)}finally{convert.disabled=false}
});
</script>
</body>
</html>
